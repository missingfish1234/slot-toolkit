<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>假3D效果測試 - 盤面傾斜</title>
    <style>
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
        }

        .test-container {
            perspective: 500px;
            perspective-origin: center 20%;
            width: 400px;
            height: 300px;
            border: 2px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(10deg) translateZ(0);
            transition: transform 0.5s ease-out;
        }

        .spinning {
            transform: rotateX(15deg) translateZ(20px);
        }

        .reel-container {
            display: flex;
            gap: 10px;
            transform-style: preserve-3d;
        }

        .reel {
            width: 80px;
            height: 200px;
            background: linear-gradient(45deg, #ff0000, #0000ff);
            border: 1px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        .reel-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            transform: translateY(0);
            transition: transform 2s ease-out;
        }

        .symbol {
            width: 100%;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div>
        <div class="test-container" id="container">
            <div class="reel-container">
                <div class="reel">
                    <div class="reel-strip" id="strip1">
                        <div class="symbol">A</div>
                        <div class="symbol">B</div>
                        <div class="symbol">C</div>
                        <div class="symbol">D</div>
                        <div class="symbol">E</div>
                        <div class="symbol">A</div>
                        <div class="symbol">B</div>
                        <div class="symbol">C</div>
                    </div>
                </div>
                <div class="reel">
                    <div class="reel-strip" id="strip2">
                        <div class="symbol">1</div>
                        <div class="symbol">2</div>
                        <div class="symbol">3</div>
                        <div class="symbol">4</div>
                        <div class="symbol">5</div>
                        <div class="symbol">1</div>
                        <div class="symbol">2</div>
                        <div class="symbol">3</div>
                    </div>
                </div>
                <div class="reel">
                    <div class="reel-strip" id="strip3">
                        <div class="symbol">X</div>
                        <div class="symbol">Y</div>
                        <div class="symbol">Z</div>
                        <div class="symbol">W</div>
                        <div class="symbol">V</div>
                        <div class="symbol">X</div>
                        <div class="symbol">Y</div>
                        <div class="symbol">Z</div>
                    </div>
                </div>
            </div>
        </div>
        <button onclick="spin()">測試假3D旋轉</button>
    </div>

    <script>
        function spin() {
            const container = document.getElementById('container');
            const strips = [document.getElementById('strip1'), document.getElementById('strip2'), document.getElementById('strip3')];

            // 添加旋轉動畫
            container.classList.add('spinning');

            // 開始轉輪動畫
            strips.forEach((strip, index) => {
                setTimeout(() => {
                    strip.style.transform = 'translateY(-200px)';
                }, index * 200);
            });

            // 2秒後停止動畫
            setTimeout(() => {
                container.classList.remove('spinning');
                strips.forEach(strip => {
                    strip.style.transform = 'translateY(0)';
                });
            }, 2000);
        }
    </script>
</body>
</html>
