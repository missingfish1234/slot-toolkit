<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>假3D效果測試</title>
    <style>
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
        }

        .test-container {
            perspective: 1000px;
            width: 200px;
            height: 200px;
            border: 2px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .reel-strip {
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, #ff0000, #0000ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            transform-style: preserve-3d;
            transition: transform 0.3s ease-out;
        }

        .spinning {
            animation: fake3d-spin 2s ease-out;
        }

        @keyframes fake3d-spin {
            0% { 
                transform: translateY(0) rotateX(0deg) scale(1); 
                filter: brightness(1);
            }
            25% { 
                transform: translateY(-30px) rotateX(-8deg) scale(1.05); 
                filter: brightness(1.2);
            }
            50% { 
                transform: translateY(-60px) rotateX(-15deg) scale(1.1); 
                filter: brightness(1.4);
            }
            75% { 
                transform: translateY(-30px) rotateX(-8deg) scale(1.05); 
                filter: brightness(1.2);
            }
            100% { 
                transform: translateY(0) rotateX(0deg) scale(1); 
                filter: brightness(1);
            }
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div>
        <div class="test-container">
            <div class="reel-strip" id="reelStrip">測試</div>
        </div>
        <button onclick="spin()">測試假3D旋轉</button>
    </div>

    <script>
        function spin() {
            const strip = document.getElementById('reelStrip');
            strip.classList.add('spinning');
            setTimeout(() => {
                strip.classList.remove('spinning');
            }, 2000);
        }
    </script>
</body>
</html>
