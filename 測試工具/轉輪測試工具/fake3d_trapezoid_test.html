<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>假3D梯形效果測試</title>
    <style>
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
        }

        .viewport {
            width: 400px;
            height: 300px;
            border: 2px solid #fff;
            position: relative;
            overflow: hidden;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fake3d-mode .viewport {
            position: relative;
            overflow: visible;
        }

        .fake3d-mode .viewport::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -10px;
            right: -10px;
            bottom: 20px;
            background: linear-gradient(135deg,
                rgba(255,255,255,0.1) 0%,
                transparent 20%,
                transparent 80%,
                rgba(0,0,0,0.2) 100%);
            border-radius: 15px;
            z-index: -1;
            transform: perspective(400px) rotateX(5deg);
            transform-origin: center bottom;
            transition: all 0.3s ease-out;
        }

        .fake3d-mode.spinning .viewport::before {
            transform: perspective(400px) rotateX(8deg) scaleY(1.05);
            background: linear-gradient(135deg,
                rgba(255,255,255,0.15) 0%,
                transparent 15%,
                transparent 85%,
                rgba(0,0,0,0.3) 100%);
        }

        .reels-container {
            display: flex;
            gap: 10px;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        .reel {
            width: 80px;
            height: 100%;
            background: #222;
            border-radius: 5px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
        }

        .fake3d-mode .reel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom,
                rgba(0,0,0,0.3) 0%,
                rgba(0,0,0,0.1) 30%,
                transparent 70%,
                rgba(255,255,255,0.1) 100%);
            pointer-events: none;
            z-index: 2;
            border-radius: 8px;
            box-shadow:
                inset 0 2px 4px rgba(255,255,255,0.1),
                inset 0 -2px 4px rgba(0,0,0,0.2),
                0 0 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease-out;
        }

        .fake3d-mode.spinning .reel::before {
            box-shadow:
                inset 0 4px 8px rgba(255,255,255,0.2),
                inset 0 -4px 8px rgba(0,0,0,0.3),
                0 0 30px rgba(0,0,0,0.4);
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div>
        <div class="viewport fake3d-mode" id="viewport">
            <div class="reels-container">
                <div class="reel">🎰</div>
                <div class="reel">⭐</div>
                <div class="reel">💎</div>
                <div class="reel">🔔</div>
                <div class="reel">🍒</div>
            </div>
        </div>
        <button onclick="toggleSpin()">測試假3D梯形效果</button>
    </div>

    <script>
        function toggleSpin() {
            const viewport = document.getElementById('viewport');
            viewport.classList.toggle('spinning');
        }
    </script>
</body>
</html>
